<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Dashboard | MFA System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>

<body class="bg-light">

  <div class="container d-flex align-items-center justify-content-center min-vh-100">
    <div class="main-wrapper">

      <div class="app-logo">AuthShield</div>
      <div class="card shadow p-4 w-100 form-card text-center">
        <h2 class="mb-3">Welcome, {{ user }}</h2>

        <div class="success-box">
          <span class="success-icon">✔</span>
          <span class="success-text">
            Successfully authenticated using Google Authenticator MFA
          </span>
        </div>

        <a href="/logout" class="btn btn-danger mt-3">Logout</a>
      </div>
    </div>
  </div>

</body>

</html>
